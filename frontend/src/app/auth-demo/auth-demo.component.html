<div style="max-width:720px;margin:2rem auto">
  <h2>Auth PKCE Demo</h2>
  <p>Statut: <strong>{{ oauth.hasValidAccessToken() ? 'connecté' : 'non connecté' }}</strong></p>

  <div style="display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem">
    <button mat-raised-button (click)="login()" *ngIf="!oauth.hasValidAccessToken()">Se connecter</button>
    <button mat-stroked-button (click)="logout()" *ngIf="oauth.hasValidAccessToken()">Se déconnecter</button>
    <button mat-stroked-button (click)="refresh()" *ngIf="oauth.hasValidAccessToken()">Refresh token</button>
    <a mat-stroked-button routerLink="/messages">Ouvrir la page "Messages"</a>
  </div>

  <pre *ngIf="me()">{{ me() | json }}</pre>
  <pre *ngIf="error()" class="small-muted">{{ error() | json }}</pre>
</div>
