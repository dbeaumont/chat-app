# version: '3.8'
services:
  db:
    image: postgres:16
    container_name: chat_db
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: chat_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/chat
      SPRING_DATASOURCE_USERNAME: chat
      SPRING_DATASOURCE_PASSWORD: chat
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: 
        http://localhost,
        http://localhost:80,
        http://localhost:8888,
        http://127.0.0.1:8888,
        http://localhost:8080,
        http://localhost:9080,
        http://localhost:4200,
        http://frontend
    ports:
      - "9080:8080"

  frontend:
    build: ./frontend
    container_name: chat_frontend
    depends_on:
      - backend
    ports:
      - "8888:80"
    environment:
      API_BASE_URL: http://localhost:9080

volumes:
  db_data:
